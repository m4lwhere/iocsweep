[project]
name = "iocsweep"
version = "2.0.0"
description = "Advanced PCAP Intelligence Extraction & IOC Hunting Tool - Maximum Intel Value for Security Analysts"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "m4lwhere", email = "m4lwhere@example.com" }
]
keywords = [
    "pcap", "network", "security", "ioc", "threat-intelligence",
    "malware", "forensics", "dfir", "packet-analysis", "scapy"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]

dependencies = [
    "scapy>=2.5.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "ipwhois>=1.2.0",
    "maxminddb>=2.4.0",
    "tldextract>=5.1.0",
    "publicsuffixlist>=0.10.0",
    "validators>=0.22.0",
    "python-magic>=0.4.27",
    "ssdeep>=3.4; sys_platform != 'win32'",
    "yara-python>=4.3.0; sys_platform != 'win32'",
    "orjson>=3.9.0",
    "jinja2>=3.1.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]
full = [
    "geoip2>=4.7.0",
]

[project.scripts]
iocsweep = "iocsweep.cli:main"

[project.urls]
Homepage = "https://github.com/m4lwhere/iocsweep"
Repository = "https://github.com/m4lwhere/iocsweep"
Issues = "https://github.com/m4lwhere/iocsweep/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iocsweep"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
